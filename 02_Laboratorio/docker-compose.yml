services:
  pagila:
    build:
      context: ./pagila-source
    container_name: tesi-pagila
    restart: unless-stopped

    environment:
      POSTGRES_DB: pagila
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PAGILA_POSTGRES_PASSWORD:?Definisci PAGILA_POSTGRES_PASSWORD in .env.pagila}

    ports:
      - "127.0.0.1:5434:5432"

    volumes:
      - pagila_data:/var/lib/postgresql
      - ./pagila-source/pagila-schema.sql:/docker-entrypoint-initdb.d/1-pagila-schema.sql:ro
      - ./pagila-source/pagila-data.sql:/docker-entrypoint-initdb.d/2-pagila-data.sql:ro
      - ./pagila-source/pg_partman-setup.sql:/docker-entrypoint-initdb.d/3-pg_partman-setup.sql:ro

volumes:
  pagila_data: